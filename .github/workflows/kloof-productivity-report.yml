name: KLOOF Productivity Report

on:
  workflow_dispatch:
    inputs:
      period:
        description: Report period
        required: true
        default: weekly
        type: choice
        options:
          - weekly
          - monthly
  schedule:
    # Saturday 09:00 Asia/Riyadh (UTC+3)
    - cron: '0 6 * * 6'
    # First day of each month 09:15 Asia/Riyadh, reporting the previous month
    - cron: '15 6 1 * *'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-report.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-report.txt

      - name: Resolve report period
        id: report_period
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "period=${{ inputs.period }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15 6 1 * *" ]; then
            echo "period=monthly" >> "$GITHUB_OUTPUT"
          else
            echo "period=weekly" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Telegram report
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KLOOF_TARGET_BARBERS: ${{ vars.KLOOF_TARGET_BARBERS || '5' }}
        run: python scripts/kloof_telegram_report.py --period "${{ steps.report_period.outputs.period }}"
